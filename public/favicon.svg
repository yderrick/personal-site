<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="yderrick">
  <!--
    A block cursor in amber on the site's warm near-black. The palette is the
    identity, so the mark is the palette plus one shape; at 16px a letterform
    would turn to mush, and a solid block does not.

    Deliberately not animated. A blinking cursor is the obvious idea, but a
    favicon cannot honour prefers-reduced-motion, and a tab that flickers in the
    corner of someone's eye is a cost with no benefit.
  -->
  <rect width="32" height="32" rx="7" fill="#14110c" />
  <rect x="10" y="7" width="8" height="18" rx="1.5" fill="#ffb000" />
  <rect x="20" y="21" width="4" height="4" rx="1" fill="#91856f" />
</svg>

name: Daily refresh

# The projects page reports commit activity across my repositories, including
# private ones. Vercel only rebuilds when this repo is pushed to, so work done
# in any *other* repo would never reach the site — the numbers would quietly
# rot while still looking current. This fires a Vercel deploy hook once a day so
# the page reflects reality rather than the last time I touched this repo.
#
# Setup (one time):
#   1. Vercel → project → Settings → Git → Deploy Hooks → create one for `main`.
#   2. Copy the URL into this repo's secrets as VERCEL_DEPLOY_HOOK.
#      gh secret set VERCEL_DEPLOY_HOOK --body '<url>'
#   3. Vercel → Settings → Environment Variables → add GITHUB_TOKEN
#      (a read-only token with `repo` scope) so the build can see private repos.
#
# The deploy hook URL is a credential: anyone holding it can trigger builds.
# It lives in secrets, never in the repo.

on:
  schedule:
    # 06:15 UTC daily. Off the hour because GitHub's scheduler is busiest then
    # and delays cron jobs that pile up on it.
    - cron: '15 6 * * *'
  # Lets me trigger a refresh by hand without waiting for the schedule.
  workflow_dispatch:

# Nothing by default. The rebuild job only calls an external hook; the keepalive
# job below grants itself `contents: write` and nothing else.
permissions: {}

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set. See the setup notes at the top of this file."
            exit 1
          fi

          # --fail turns an HTTP error into a non-zero exit, so a broken or
          # revoked hook shows up as a failed run rather than a silent no-op.
          # A refresh that quietly stops working is the failure mode this whole
          # workflow exists to prevent.
          status=$(curl --silent --show-error --fail \
            --request POST \
            --write-out '%{http_code}' \
            --output /dev/null \
            "$DEPLOY_HOOK")

          echo "Deploy hook responded $status"

  # GitHub switches off scheduled workflows in a public repo after 60 days with
  # no commits to it, and work in my other repos doesn't count. It happened on
  # 17 Nov 2026: the refresh silently stopped, which is the exact failure this
  # file exists to prevent.
  #
  # So when this repo has gone 45 days without a commit, this job adds one empty
  # commit to main. That is ordinary repository activity, which resets the clock.
  # (Re-enabling the workflow through the API is the other trick in circulation,
  # but whether it resets the timer is undocumented; a commit certainly does.)
  # While I'm committing here normally it does nothing at all.
  #
  # The commit is made through the API, so there is no checkout and no
  # third-party action. Commits made with GITHUB_TOKEN don't start other
  # workflows; Vercel will still rebuild for it, which is harmless.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add an empty commit if this repo has been quiet for 45 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          QUIET_DAYS: 45
        run: |
          # One read, so the commit and its date can't come from different moments.
          read -r head last < <(gh api "repos/$REPO/commits/$BRANCH" \
            --jq '"\(.sha) \(.commit.committer.date)"')
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Last commit on $BRANCH: $last ($age days ago)."

          if [ "$age" -lt "$QUIET_DAYS" ]; then
            echo "Under $QUIET_DAYS days: nothing to do."
            exit 0
          fi

          tree=$(gh api "repos/$REPO/git/commits/$head" --jq '.tree.sha')
          commit=$(gh api "repos/$REPO/git/commits" \
            -f message="Keep the daily refresh switched on

          GitHub disables scheduled workflows after 60 days without a commit.
          This empty commit is automatic; see the keepalive job in refresh.yml." \
            -f tree="$tree" \
            -f "parents[]=$head" \
            --jq '.sha')

          # No force: if main moved since we read it, this fails loudly rather
          # than throwing away whatever landed in between.
          gh api --method PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$commit" --silent
          echo "Added empty commit $commit after $age quiet days."
